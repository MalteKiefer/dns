name: DNS Deploy

# Preview on pull requests, push to deSEC on merge to main.
on:
  push:
    branches: [main]
    paths:
      - 'dnsconfig.js'
      - 'creds.json'
      - '.github/workflows/dns.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dnsconfig.js'
      - 'creds.json'
      - '.github/workflows/dns.yml'
  workflow_dispatch:

# Never run two deployments at once, and never cancel one mid-flight.
concurrency:
  group: dns-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only the live push needs the protected environment.
    environment: ${{ github.event_name == 'pull_request' && '' || 'production' }}
    env:
      DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-go@main
        with:
          go-version: stable

      - name: Install dnscontrol
        run: |
          go install github.com/DNSControl/dnscontrol/v4@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check syntax
        run: dnscontrol check

      # Pull requests only show the diff; they never touch the live zone.
      - name: Preview changes
        if: github.event_name == 'pull_request'
        run: dnscontrol preview

      # Pushes to main and manual runs apply the changes.
      # dnscontrol push validates and prints the diff before applying.
      - name: Push changes
        if: github.event_name != 'pull_request'
        run: dnscontrol push
